apiVersion: apps/v1
kind: Deployment
metadata: {name: patient-service, namespace: medcareai}
spec:
  replicas: 2
  selector: {matchLabels: {app: patient-service}}
  template:
    metadata: {labels: {app: patient-service}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: patient-service
          image: ghcr.io/abhijeet9066-hub/medcareai-cloud-native-microservices/patient:latest
          ports: [{name: http, containerPort: 8000}]
          resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: patient-service, namespace: medcareai}
spec:
  selector: {app: patient-service}
  ports: [{name: http, port: 8000, targetPort: http}]
---
