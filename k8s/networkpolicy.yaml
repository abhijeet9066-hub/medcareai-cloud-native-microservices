apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: medcareai}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-gateway-to-services, namespace: medcareai}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [patient-service, appointment-service]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api-gateway}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-appointment-worker-to-redis, namespace: medcareai}
spec:
  podSelector: {matchLabels: {app: redis}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [appointment-service, audit-worker]
      ports: [{protocol: TCP, port: 6379}]
