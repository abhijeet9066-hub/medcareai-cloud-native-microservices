apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medcareai
  namespace: medcareai
spec:
  rules:
    - host: medcareai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: {number: 80}
